# Free Supabase projects pause after 7 days without activity.
# This reads one row every 3 days so the portfolio database stays awake.
name: Keep Supabase awake

on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # The anon key is public (the website uses it too); the database rules keep the data safe
      - name: Read one project
        run: |
          curl --fail --silent --show-error \
            "https://aazwazoxxfiazognvjtv.supabase.co/rest/v1/projects?select=id&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFhendhem94eGZpYXpvZ252anR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMDQxODQsImV4cCI6MjEwODY4MDE4NH0.jvRM6iZnagnBJ6-7NNSy1-QzowBhZf1Jdipajy9E9JM" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFhendhem94eGZpYXpvZ252anR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMDQxODQsImV4cCI6MjEwODY4MDE4NH0.jvRM6iZnagnBJ6-7NNSy1-QzowBhZf1Jdipajy9E9JM"
